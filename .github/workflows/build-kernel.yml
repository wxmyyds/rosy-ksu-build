name: Build rosy kernel with ReSukiSU

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-kernel-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # 固定 runner：内核 4.9 的警告抑制清单针对 GCC 13 调校，且避免 ubuntu-latest 迁移到 26 后工具链漂移
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v7

      - name: Clone kernel source from GitHub
        run: |
          git clone https://github.com/baunilla/android_kernel_xiaomi_rosy.git \
            -b lineage-21.0 --depth=1 rosy

      - name: Integrate ReSukiSU
        working-directory: rosy
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          echo "CONFIG_KSU=y" >> arch/arm64/configs/rosy-perf_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/rosy-perf_defconfig
          sed -i 's/^CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/' arch/arm64/configs/rosy-perf_defconfig
          echo "# CONFIG_BTFM_SLIM is not set" >> arch/arm64/configs/rosy-perf_defconfig
          echo "CONFIG_SLIMBUS=y" >> arch/arm64/configs/rosy-perf_defconfig
          ln -sf "$(pwd)/drivers/gpu/msm/kgsl_trace.h" include/trace/kgsl_trace.h

      - name: Apply kernel patches
        working-directory: rosy
        run: |
          git apply $GITHUB_WORKSPACE/patches/*.patch

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev python3 \
            python3-pip cpio rsync device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      # 内核 4.9 的顶层 Makefile 会用 $(CROSS_COMPILE)gcc 覆盖环境变量 CC/LD，
      # 实际编译工具链是 apt 安装的 GCC 13， clang 下载步骤属于无效开销，已移除。
      - name: Build kernel
        working-directory: rosy
        env:
          WARN_SUPPRESS: >-
            -Wno-misleading-indentation
            -Wno-address
            -Wno-maybe-uninitialized
            -Wno-enum-int-mismatch
            -Wno-dangling-pointer
            -Wno-unused-label
            -Wno-switch-unreachable
            -Wno-memset-elt-size
            -Wno-enum-compare
            -Wno-bool-operation
            -Wno-bool-compare
            -Wno-array-compare
        run: |
          set -o pipefail
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          make rosy-perf_defconfig
          make -j$(nproc) Image.gz-dtb KCFLAGS="$WARN_SUPPRESS" 2>&1 | tee build.log

      - name: Extract kernel version
        working-directory: rosy
        run: |
          KERNEL_VER=$(grep -oP 'UTS_RELEASE "\K[^"]+' include/generated/utsrelease.h)
          echo "$KERNEL_VER" > $GITHUB_WORKSPACE/kernel_version.txt
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV

      - name: Capture KSU version
        working-directory: rosy
        run: |
          cd KernelSU
          KSU_LOCAL_VERSION=$(git rev-list --count HEAD)
          KSU_VERSION=$((30000 + KSU_LOCAL_VERSION + 700))
          KSU_SHA=$(git rev-parse HEAD)
          KSU_TAG=$(git describe --abbrev=0 --tags 2>/dev/null || echo "dev")
          echo "$KSU_VERSION $KSU_SHA $KSU_TAG" > $GITHUB_WORKSPACE/ksu_version.txt
          echo "KSU_VERSION=$KSU_VERSION" >> $GITHUB_ENV

      - name: Build AnyKernel3 package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/ak3
          cp rosy/arch/arm64/boot/Image.gz-dtb /tmp/ak3/Image.gz-dtb
          cp "$GITHUB_WORKSPACE/ak3/anykernel.sh" /tmp/ak3/anykernel.sh
          cd /tmp/ak3
          rm -rf .git LICENSE README.md .github modules patch ramdisk
          zip -r9 $GITHUB_WORKSPACE/rosy-ksu-ak3.zip .

      - name: Upload kernel
        uses: actions/upload-artifact@v7
        with:
          name: rosy-kernel-resukisu
          retention-days: 30
          path: |
            rosy/arch/arm64/boot/Image.gz-dtb
            rosy/build.log
            rosy-ksu-ak3.zip
            kernel_version.txt
            ksu_version.txt
