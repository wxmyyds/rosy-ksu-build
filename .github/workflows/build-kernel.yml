name: Build rosy kernel with ReSukiSU

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: '创建 GitHub Release（勾选 = 发版，不勾选 = 仅构建）'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Clone kernel source from GitHub
        run: |
          git clone https://github.com/baunilla/android_kernel_xiaomi_rosy.git \
            -b lineage-21.0 --depth=1 rosy

      - name: Integrate ReSukiSU
        working-directory: rosy
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          echo "CONFIG_KSU=y" >> arch/arm64/configs/rosy-perf_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/rosy-perf_defconfig
          sed -i 's/^CONFIG_CC_STACKPROTECTOR_STRONG=y/CONFIG_CC_STACKPROTECTOR_NONE=y/' arch/arm64/configs/rosy-perf_defconfig
          echo "# CONFIG_BTFM_SLIM is not set" >> arch/arm64/configs/rosy-perf_defconfig
          echo "CONFIG_SLIMBUS=y" >> arch/arm64/configs/rosy-perf_defconfig
          ln -sf "$(pwd)/drivers/gpu/msm/kgsl_trace.h" include/trace/kgsl_trace.h

      - name: Apply kernel patches
        working-directory: rosy
        run: |
          bash $GITHUB_WORKSPACE/patches/apply-patches.sh

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev python3 \
            python3-pip cpio rsync device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup AOSP clang toolchain
        run: |
          mkdir -p toolchain && cd toolchain
          git clone --depth=1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang
          cd clang
          git sparse-checkout set clang-r498229b
          echo "CLANG_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Build kernel
        working-directory: rosy
        run: |
          export PATH="${{ env.CLANG_DIR }}/clang-r498229b/bin:/usr/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export AS=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          make rosy-perf_defconfig
          make -j$(nproc) Image.gz-dtb KCFLAGS="-Wno-error=misleading-indentation -Wno-error=maybe-uninitialized -Wno-error=address" 2>&1 | tee build.log

      - name: Extract kernel version
        working-directory: rosy
        run: |
          KERNEL_VER=$(grep -oP 'UTS_RELEASE "\K[^"]+' include/generated/utsrelease.h)
          echo "$KERNEL_VER" > $GITHUB_WORKSPACE/kernel_version.txt
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV

      - name: Build AnyKernel3 package
        run: |
          git clone --depth=1 https://github.com/osm0sis/AnyKernel3 /tmp/ak3
          cp rosy/arch/arm64/boot/Image.gz-dtb /tmp/ak3/Image.gz-dtb
          echo '### AnyKernel3 Ramdisk Mod Script' > /tmp/ak3/anykernel.sh
          echo '## osm0sis @ xda-developers' >> /tmp/ak3/anykernel.sh
          echo '' >> /tmp/ak3/anykernel.sh
          echo '### AnyKernel setup' >> /tmp/ak3/anykernel.sh
          echo "properties() { '" >> /tmp/ak3/anykernel.sh
          echo "kernel.string=ReSukiSU for Xiaomi Redmi 5 (rosy) by wxmyyds" >> /tmp/ak3/anykernel.sh
          echo "do.devicecheck=1" >> /tmp/ak3/anykernel.sh
          echo "device.name1=rosy" >> /tmp/ak3/anykernel.sh
          echo "do.cleanup=1" >> /tmp/ak3/anykernel.sh
          echo "'; }" >> /tmp/ak3/anykernel.sh
          echo '' >> /tmp/ak3/anykernel.sh
          echo 'BLOCK=/dev/block/bootdevice/by-name/boot;' >> /tmp/ak3/anykernel.sh
          echo 'is_slot_device=auto;' >> /tmp/ak3/anykernel.sh
          echo 'no_block_display=1;' >> /tmp/ak3/anykernel.sh
          echo '' >> /tmp/ak3/anykernel.sh
          echo '. tools/ak3-core.sh;' >> /tmp/ak3/anykernel.sh
          echo '' >> /tmp/ak3/anykernel.sh
          echo 'split_boot;' >> /tmp/ak3/anykernel.sh
          echo 'flash_boot;' >> /tmp/ak3/anykernel.sh
          cd /tmp/ak3
          rm -rf .git LICENSE README.md .github modules patch ramdisk
          zip -r9 $GITHUB_WORKSPACE/rosy-ksu-ak3.zip .

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: rosy-kernel-resukisu
          path: |
            rosy/arch/arm64/boot/Image.gz-dtb
            rosy/build.log
            rosy-ksu-ak3.zip
            kernel_version.txt

      - name: Create Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Fetch existing releases to find the next tag
          RELEASES=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName')
          MAX_NUM=0
          for tag in $RELEASES; do
            NUM=$(echo "$tag" | grep -oP '^v\K\d+' || echo 0)
            if [ "$NUM" -gt "$MAX_NUM" ]; then
              MAX_NUM=$NUM
            fi
          done
          NEXT_NUM=$((MAX_NUM + 1))
          TAG="v$NEXT_NUM"
          KERNEL_VER=$(cat kernel_version.txt)
          RELEASE_NAME="ReSukiSU-rosy-$KERNEL_VER-$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

      - name: Publish Release
        if: ${{ github.event.inputs.create_release == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            ## ReSukiSU for Xiaomi Redmi 5 (rosy)

            **内核版本:** ${{ env.KERNEL_VER }}
            **构建时间:** ${{ github.event.repository.updated_at }}

            ### 刷写方法
            1. 下载 `rosy-ksu-ak3.zip`
            2. 在 ReSukiSU 管理器中选择 AnyKernel3 刷写
            3. 重启
          artifacts: rosy-ksu-ak3.zip
          token: ${{ secrets.GITHUB_TOKEN }}