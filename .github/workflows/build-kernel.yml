name: Build rosy kernel with ReSukiSU

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Clone kernel source from GitHub
        run: |
          git clone https://github.com/baunilla/android_kernel_xiaomi_rosy.git \
            -b lineage-21.0 --depth=1 rosy

      - name: Integrate ReSukiSU
        working-directory: rosy
        run: |
          curl -LSs "https://raw.githubusercontent.com/ReSukiSU/ReSukiSU/main/kernel/setup.sh" | bash
          echo "CONFIG_KSU=y" >> arch/arm64/configs/rosy-perf_defconfig
          echo "CONFIG_KSU_MANUAL_HOOK=y" >> arch/arm64/configs/rosy-perf_defconfig
          # AOSP clang 兼容性修复
          echo "CONFIG_CC_STACKPROTECTOR_NONE=y" >> arch/arm64/configs/rosy-perf_defconfig
          # 缺失 btfm_slim.h 头文件
          echo "# CONFIG_BTFM_SLIM is not set" >> arch/arm64/configs/rosy-perf_defconfig
          # clang 兼容性修复：蓝牙驱动头文件包含路径
          sed -i '/ccflags-y += -D__CHECK_ENDIAN__/accflags-y += -I$(srctree)/drivers/bluetooth' drivers/bluetooth/Makefile
          # clang 兼容性修复：kgsl trace 头文件包含路径
          sed -i 's|ccflags-y := -Iinclude/linux|ccflags-y := -Iinclude/linux -I$(srctree)/drivers/gpu/msm|' drivers/gpu/msm/Makefile
          # kgsl_trace.h 符号链接，确保 trace 基础设施能找到头文件
          ln -sf "$(pwd)/drivers/gpu/msm/kgsl_trace.h" include/trace/kgsl_trace.h
          # techpack Kbuild 自带 -Werror，压制 misleading-indentation 警告
          sed -i '/EXTRA_CFLAGS += \$\$(INCS)/aEXTRA_CFLAGS += -Wno-error=misleading-indentation' techpack/audio/asoc/codecs/sdm660_cdc/Kbuild

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison flex libssl-dev python3 \
            python3-pip cpio rsync device-tree-compiler \
            gcc-aarch64-linux-gnu gcc-arm-linux-gnueabi

      - name: Setup AOSP clang toolchain
        run: |
          mkdir -p toolchain && cd toolchain
          git clone --depth=1 --filter=blob:none --sparse \
            https://android.googlesource.com/platform/prebuilts/clang/host/linux-x86 \
            clang
          cd clang
          git sparse-checkout set clang-r498229b
          echo "CLANG_DIR=$(pwd)" >> $GITHUB_ENV

      - name: Build kernel
        working-directory: rosy
        run: |
          export PATH="${{ env.CLANG_DIR }}/clang-r498229b/bin:/usr/bin:$PATH"
          export ARCH=arm64
          export CROSS_COMPILE=aarch64-linux-gnu-
          export CROSS_COMPILE_ARM32=arm-linux-gnueabi-
          export CC=clang
          export CLANG_TRIPLE=aarch64-linux-gnu-
          export AS=clang
          export LD=ld.lld
          export AR=llvm-ar
          export NM=llvm-nm
          export OBJCOPY=llvm-objcopy
          export OBJDUMP=llvm-objdump
          export STRIP=llvm-strip
          make rosy-perf_defconfig
          make -j$(nproc) Image.gz-dtb 2>&1 | tee build.log

      - name: Upload kernel
        uses: actions/upload-artifact@v4
        with:
          name: rosy-kernel-resukisu
          path: |
            rosy/arch/arm64/boot/Image.gz-dtb
            rosy/build.log