name: Build and release rosy kernel

on:
  schedule:
    # 每周五 12:00 北京时间（UTC+8）= UTC 04:00：定时运行先构建新内核，
    # 构建成功后立即发布（约 12:25）。构建失败则不发布。
    - cron: '0 4 * * 5'
  workflow_dispatch:
    inputs:
      tag:
        description: '自定义 tag（留空 = 自动递增 v1/v2/...）'
        required: false
        default: ''
      run_id:
        description: '指定构建 run ID（留空 = 使用最近一次成功构建）'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}

jobs:
  release:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: write
    steps:
      # 定时触发：先构建新内核并等它跑完；手动触发则跳过，直接发布现有最新构建
      - name: Build kernel first
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh workflow run build-kernel.yml --ref main
          echo "Build dispatched, waiting for registration..."
          sleep 30
          BUILD_RUN=$(gh run list --repo ${{ github.repository }} --workflow=build-kernel.yml \
            --branch main --limit 1 --json databaseId --jq '.[0].databaseId')
          echo "Watching build run: $BUILD_RUN"
          gh run watch "$BUILD_RUN" --repo ${{ github.repository }} --exit-status --interval 60

      - name: Resolve build run ID
        id: run
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.run_id }}" ]; then
            RUN_ID="${{ github.event.inputs.run_id }}"
            echo "Using provided run_id: $RUN_ID"
          else
            RUN_ID=$(gh run list --repo ${{ github.repository }} --workflow=build-kernel.yml --status=success --limit=1 --json databaseId --jq '.[0].databaseId')
            echo "Using latest successful build run: $RUN_ID"
          fi
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "::error::No successful build found. Run the build workflow first."
            exit 1
          fi
          echo "RUN_ID=$RUN_ID" >> $GITHUB_ENV

      - name: Download build artifact
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh run download $RUN_ID --repo ${{ github.repository }} --name rosy-kernel-bakasu --dir artifacts

      - name: Read build metadata
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ ! -s artifacts/ksu_version.txt ]; then
            echo "::error::ksu_version.txt 缺失。该构建早于 KSU 元数据功能，请先重新跑一次 Build 工作流。"
            exit 1
          fi
          KERNEL_VER=$(cat artifacts/kernel_version.txt)
          echo "KERNEL_VER=$KERNEL_VER" >> $GITHUB_ENV
          echo "KERNEL_VER=$KERNEL_VER"
          read KSU_VER KSU_SHA KSU_TAG <<< "$(cat artifacts/ksu_version.txt)"
          echo "KSU_VER=$KSU_VER" >> $GITHUB_ENV
          echo "KSU_VER=$KSU_VER"
          echo "KSU_SHA=$KSU_SHA" >> $GITHUB_ENV
          echo "KSU_SHA=$KSU_SHA"
          echo "KSU_TAG=$KSU_TAG" >> $GITHUB_ENV
          echo "KSU_TAG=$KSU_TAG"
          BUILD_TIME_UTC=$(gh run view $RUN_ID --repo ${{ github.repository }} --json createdAt --jq '.createdAt')
          BUILD_TIME=$(TZ=Asia/Shanghai date -d "$BUILD_TIME_UTC" "+%Y-%m-%d %H:%M:%S")
          echo "BUILD_TIME=$BUILD_TIME" >> $GITHUB_ENV
          echo "BUILD_TIME=$BUILD_TIME"

      - name: Compute release tag
        id: tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
            echo "Using provided tag: $TAG"
          else
            RELEASES=$(gh release list --repo ${{ github.repository }} --limit 100 --json tagName --jq '.[].tagName')
            MAX_NUM=0
            for t in $RELEASES; do
              NUM=$(echo "$t" | grep -oP '^v\K\d+' || echo 0)
              if [ "$NUM" -gt "$MAX_NUM" ]; then
                MAX_NUM=$NUM
              fi
            done
            TAG="v$((MAX_NUM + 1))"
            echo "Auto-incremented tag: $TAG"
          fi
          RELEASE_NAME="BakaSU-rosy-$KERNEL_VER-$TAG"
          echo "TAG=$TAG" >> $GITHUB_ENV
          echo "RELEASE_NAME=$RELEASE_NAME" >> $GITHUB_ENV

      # nightly.link 对 Baka-SU/BakaSU 已失效（上游仓库改名后应用授权丢失），
      # 改为直接拉取匹配 commit 的管理器产物并作为 Release 附件。
      # 需要 CROSS_REPO_TOKEN（对公开仓库有 actions:read 的 PAT）；未配置时退化为
      # 指向 Actions run 页面的链接。
      - name: Resolve manager APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CROSS_REPO_TOKEN: ${{ secrets.CROSS_REPO_TOKEN }}
        run: |
          MANAGER_RUN=$(gh run list --repo Baka-SU/BakaSU --workflow=build-manager.yml \
            --commit "$KSU_SHA" --status=success --json databaseId --jq '.[0].databaseId')
          if [ -n "$MANAGER_RUN" ] && [ "$MANAGER_RUN" != "null" ]; then
            echo "Found matching manager build for $KSU_SHA: $MANAGER_RUN"
            if [ -n "$CROSS_REPO_TOKEN" ]; then
              ART_ID=$(gh api -H "Authorization: Bearer $CROSS_REPO_TOKEN" \
                "repos/Baka-SU/BakaSU/actions/runs/$MANAGER_RUN/artifacts" \
                --jq '.artifacts[] | select(.name=="Manager-release") | .id')
              if [ -n "$ART_ID" ]; then
                gh api -H "Authorization: Bearer $CROSS_REPO_TOKEN" \
                  "repos/Baka-SU/BakaSU/actions/artifacts/$ART_ID/zip" > /tmp/manager.zip
                python3 -m zipfile -e /tmp/manager.zip /tmp/manager/
                APK=$(find /tmp/manager -name "*arm64-v8a-release.apk" | head -1)
                if [ -n "$APK" ]; then
                  APK_NAME=$(basename "$APK")
                  cp "$APK" "artifacts/$APK_NAME"
                  MANAGER_URL="https://github.com/${{ github.repository }}/releases/download/$TAG/$APK_NAME"
                  echo "MANAGER_APK=artifacts/$APK_NAME" >> $GITHUB_ENV
                fi
              fi
            fi
            [ -n "$MANAGER_URL" ] || MANAGER_URL="https://github.com/Baka-SU/BakaSU/actions/runs/$MANAGER_RUN"
          else
            MANAGER_URL="https://github.com/Baka-SU/BakaSU/actions/workflows/build-manager.yml"
            echo "No manager build for $KSU_SHA, linking workflow page"
          fi
          echo "MANAGER_URL=$MANAGER_URL" >> $GITHUB_ENV
          echo "MANAGER_URL=$MANAGER_URL"

      - name: Publish Release
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ env.TAG }}
          name: ${{ env.RELEASE_NAME }}
          body: |
            - **Time**: ${{ env.BUILD_TIME }} # UTC+8

            - **Codename**: rosy

            <br>

            - **[Kernel](https://github.com/baunilla/android_kernel_xiaomi_rosy) Version**: ${{ env.KERNEL_VER }}
            - **[BakaSU](https://github.com/Baka-SU/BakaSU) Version**: ${{ env.KSU_VER }}

            <br>

            - **BakaSU Manager**: [BakaSU Manager (${{ env.KSU_TAG }} ${{ env.KSU_VER }})](${{ env.MANAGER_URL }})
          artifacts: artifacts/rosy-ksu-ak3.zip
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Attach manager APK
        if: env.MANAGER_APK != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$TAG" "$MANAGER_APK" --repo ${{ github.repository }} --clobber
